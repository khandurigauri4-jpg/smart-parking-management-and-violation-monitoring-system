<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guard / Operator Login / Signup | Smart Parking</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="index.html">Smart Parking</a></header><main><div class="page-heading"><h1>Guard / Operator Account</h1><p>Log in or create an operator account to access parking management.</p></div>
<section class="panel narrow auth-panel"><div class="auth-tabs"><button type="button" class="auth-tab active" data-mode="login">Login</button><button type="button" class="auth-tab" data-mode="signup">Sign Up</button></div>
<form id="authForm" data-role="ADMIN"><label id="nameField" class="auth-hidden">Full name<input id="authName" maxlength="80" autocomplete="name" placeholder="Your full name"></label><label>Email address<input id="authEmail" type="email" required autocomplete="email" placeholder="operator@example.com"></label><label>Password<input id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></label><button id="authSubmit" type="submit">Login</button></form><p id="authMessage" class="muted small" role="status" aria-live="polite"></p><p class="muted small">For authorized guard and operator access.</p></section></main><p class="auth-back"><a href="index.html">Back to dashboard selection</a></p><footer>Smart Parking Management System · B.Tech CSE Project</footer><script src="auth.js"></script></body></html>
