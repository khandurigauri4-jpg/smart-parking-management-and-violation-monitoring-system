<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live Parking Slots | Smart Parking</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">Smart Parking</a><nav><a href="index.html" data-page="dashboard">Dashboard</a><a href="reserve.html" data-page="reserve">Reserve a Slot</a><a href="slots.html" data-page="slots">Live Parking Slots</a><a href="history.html" data-page="history">Reservations &amp; History</a></nav></header><main><div class="page-heading"><h1>Live Parking Slots</h1><p>Smart Parking Management System</p></div>
<section class="panel"><div class="panel-heading"><h2>Slot Availability</h2><button type="button" id="refreshSlots">Refresh</button></div><p class="legend"><span class="dot green"></span> Available <span class="dot red"></span> Occupied</p><div id="liveSlots" class="parking-grid"></div></section>
<section class="panel"><h2>Park a Vehicle</h2><form id="parkForm" class="inline-form"><label>Vehicle number<input id="vehicleNumber" required placeholder="e.g. UK07AB1234"></label><button type="submit">Park Vehicle</button></form><h2 class="spaced">Release a Vehicle</h2><form id="releaseForm" class="inline-form"><label>Occupied slot<select id="slotNumber" required><option value="">Choose an occupied slot</option></select></label><button type="submit" class="secondary">Release Slot</button></form></section></main><div id="message" role="status" aria-live="polite"></div><footer>Smart Parking Management System · B.Tech CSE Project</footer><script src="script.js"></script></body></html>
