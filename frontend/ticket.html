<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Parking Ticket | Smart Parking</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="index.html">Smart Parking</a><nav><a href="index.html" data-page="dashboard">Dashboard</a><a href="reserve.html" data-page="reserve">Reserve a Slot</a><a href="slots.html" data-page="slots">Live Parking Slots</a><a href="history.html" data-page="history">Reservations &amp; History</a><a href="ticket.html" data-page="ticket">Tickets</a><a href="violations.html" data-page="violations">Violations</a></nav></header>
<main><div class="page-heading"><h1>Parking Ticket</h1><p>Entry, exit, duration and fee details</p></div><section class="panel" id="ticketPanel"><p class="muted">Loading ticket details…</p></section><section class="panel"><button type="button" onclick="window.print()">Print Ticket</button> <a href="slots.html">Back to parking slots</a></section></main><div id="message" role="status" aria-live="polite"></div><footer>Smart Parking Management System · B.Tech CSE Project</footer>
<script>
const API='http://localhost:3000/api';const panel=document.getElementById('ticketPanel');const fmt=v=>v?new Date(v).toLocaleString():'Not recorded yet';const money=v=>'₹'+Number(v||0).toFixed(2);
async function loadTicket(){const id=new URLSearchParams(location.search).get('id');if(!id){panel.innerHTML='<p>No ticket selected. Park or release a vehicle first, or open a ticket from the session history.</p>';return;}try{const r=await fetch(`${API}/parking/sessions/ticket/${encodeURIComponent(id)}`);const d=await r.json();if(!r.ok)throw Error(d.message||'Ticket could not be loaded');panel.innerHTML=`<h2>${d.ticketId}</h2><p><strong>Status:</strong> ${d.status}</p><div class="table-wrap"><table><tbody><tr><th>Vehicle Number</th><td>${escapeHtml(d.vehicleNumber)}</td></tr><tr><th>Slot</th><td>${d.slotId}</td></tr><tr><th>Time In</th><td>${fmt(d.entryTime)}</td></tr><tr><th>Time Out</th><td>${fmt(d.exitTime)}</td></tr><tr><th>Allowed Duration</th><td>${d.allowedHours||2} hour(s)</td></tr><tr><th>Actual Duration</th><td>${d.exitTime?`${Math.floor((d.durationMinutes||0)/60)} hour(s) ${(d.durationMinutes||0)%60} minute(s)`:'Still parked'}</td></tr><tr><th>Parking Fee</th><td>${money(d.fee)}</td></tr></tbody></table></div><p class="muted">Digital payment QR code will be added in the next project phase.</p>`;}catch(e){panel.textContent=e.message;}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}loadTicket();
</script></body></html>
