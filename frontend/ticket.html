<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Parking Ticket | Smart Parking</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="operator.html">Smart Parking</a><nav><a href="operator.html" data-page="dashboard">Dashboard</a><a href="reserve.html" data-page="reserve">Reserve a Slot</a><a href="slots.html" data-page="slots">Live Parking Slots</a><a href="history.html" data-page="history">Reservations &amp; History</a><a href="ticket.html" data-page="ticket">Tickets</a><a href="violations.html" data-page="violations">Violations</a></nav></header>
<main><div class="page-heading"><h1>Parking Ticket</h1><p>Entry, exit, duration and fee details</p></div><section class="panel" id="ticketPanel"><p class="muted">Loading ticket details…</p></section><section class="panel"><button type="button" onclick="window.print()">Print Ticket</button> <a href="slots.html">Back to parking slots</a></section></main><div id="message" role="status" aria-live="polite"></div><footer>Smart Parking Management System · B.Tech CSE Project</footer>
<script>
const API='http://localhost:3000/api';const panel=document.getElementById('ticketPanel');const fmt=v=>v?new Date(v).toLocaleString():'Not recorded yet';const money=v=>'₹'+Number(v||0).toFixed(2);
async function loadTicket(){const id=new URLSearchParams(location.search).get('id');if(!id){panel.innerHTML='<p>No ticket selected. Park or release a vehicle first, or open a ticket from the session history.</p>';return;}try{const r=await fetch(`${API}/parking/sessions/ticket/${encodeURIComponent(id)}`);const d=await r.json();if(!r.ok)throw Error(d.message||'Ticket could not be loaded');const paid=d.paymentStatus==='PAID';const qrPayload=`SMART-PARKING-DEMO|TICKET|${d.ticketId}|${Number(d.fee||0).toFixed(2)}`;const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(qrPayload);panel.innerHTML=`<h2>${escapeHtml(d.ticketId)}</h2><p><strong>Status:</strong> ${escapeHtml(d.status)}</p><div class="table-wrap"><table><tbody><tr><th>Vehicle Number</th><td>${escapeHtml(d.vehicleNumber)}</td></tr><tr><th>Slot</th><td>${d.slotId}</td></tr><tr><th>Time In</th><td>${fmt(d.entryTime)}</td></tr><tr><th>Time Out</th><td>${fmt(d.exitTime)}</td></tr><tr><th>Allowed Duration</th><td>${d.allowedHours||2} hour(s)</td></tr><tr><th>Actual Duration</th><td>${d.exitTime?`${Math.floor((d.durationMinutes||0)/60)} hour(s) ${(d.durationMinutes||0)%60} minute(s)`:'Still parked'}</td></tr><tr><th>Parking Fee</th><td><strong>${money(d.fee)}</strong></td></tr></tbody></table></div><section class="panel" style="margin-top:18px"><h2>QR Demo Payment</h2><p><strong>Amount due: ${money(d.fee)}</strong></p><p class="muted">Demo only — this QR does not transfer real money. Scan it to view the ticket and amount reference, then confirm using the button below.</p><img src="${qrUrl}" alt="Demo payment QR for ticket ${escapeHtml(d.ticketId)}" width="180" height="180" style="display:block;max-width:100%;margin:12px auto"/><p><strong>Payment status:</strong> <span class="status-pill ${paid?'paid':'pending'}">${paid?'PAID':'PENDING'}</span></p>${paid?`<p>Demo reference: ${escapeHtml(d.paymentReference||'—')}<br>Paid at: ${fmt(d.paidAt)}</p>`:d.status==='COMPLETED'?`<button id="simulatePayment" type="button">Simulate Successful Payment</button>`:'<p class="muted">The payment QR becomes payable after the vehicle exits and the final fee is calculated.</p>'}</section>`;const btn=document.getElementById('simulatePayment');if(btn)btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='Recording demo payment…';try{const pr=await fetch(`${API}/parking/sessions/ticket/${encodeURIComponent(d.ticketId)}/simulate-payment`,{method:'PATCH'});const pd=await pr.json();if(!pr.ok)throw Error(pd.message||'Payment failed');await loadTicket();}catch(e){alert(e.message);btn.disabled=false;btn.textContent='Simulate Successful Payment';}});}catch(e){panel.textContent=e.message;}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}loadTicket();
</script></body></html>
