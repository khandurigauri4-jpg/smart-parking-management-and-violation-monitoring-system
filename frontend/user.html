<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>User Reservation | Smart Parking</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">Smart Parking</a></header><main><div class="page-heading"><h1>User Registration &amp; Reservation</h1><p>Enter your details to reserve a parking slot.</p></div>
<section class="panel narrow"><h2>Registration Details</h2><p class="muted">Enter the person responsible for this booking.</p><form id="reservationForm"><div class="form-grid"><label>Full name<input id="customerName" required maxlength="80" autocomplete="name" placeholder="Your full name"></label><label>Email address<input id="customerEmail" type="email" required maxlength="120" autocomplete="email" placeholder="you@example.com"></label><label>Phone number<input id="customerPhone" type="tel" required pattern="[0-9+() -]{7,20}" maxlength="20" autocomplete="tel" placeholder="Phone number"></label><label>Vehicle number<input id="reservationVehicle" required maxlength="20" placeholder="e.g. UK07AB1234"></label><label>Parking slot<select id="reservationSlot" required><option value="">Choose an available slot</option></select></label><label>Reservation starts<input id="reservedFrom" type="datetime-local" required></label><label>Reservation ends<input id="reservedUntil" type="datetime-local" required></label></div><p class="muted small">Your details will be saved with your reservation.</p><button type="submit">Confirm Reservation</button></form></section></main><p style="text-align:center"><a href="index.html">Back</a></p><div id="message" role="status" aria-live="polite"></div><footer>Smart Parking Management System · B.Tech CSE Project</footer><script src="script.js"></script></body></html>
